name: Stage npm update for approval

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Build and release LEWIS ENCHANT']
    branches: [main, master]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: open-beauty-npm-publish
  cancel-in-progress: false

jobs:
  stage:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name != 'workflow_run' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require author-written notes for this exact version
        run: node scripts/check-release-notes.mjs
      - name: Use npm with staged trusted publishing
        run: npm install --global npm@12.2.1 --ignore-scripts
      - name: Download the exact verified GitHub Release package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          mkdir -p npm-release
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "dsh-openup-lewis-$VERSION.tgz" --pattern npm-update.json --dir npm-release
      - name: Verify package and submit for owner approval
        shell: bash
        env:
          RELEASE_SOURCE_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          SOURCE_ARGS=()
          if [ -n "$RELEASE_SOURCE_COMMIT" ]; then
            SOURCE_ARGS=(--source-commit "$RELEASE_SOURCE_COMMIT")
          fi
          node scripts/publish-npm-entry.mjs --tarball "npm-release/dsh-openup-lewis-$VERSION.tgz" --metadata npm-release/npm-update.json --repo "$GITHUB_REPOSITORY" "${SOURCE_ARGS[@]}"

name: Check plugin regressions

on:
  workflow_call:
  pull_request:
  push:
    branches-ignore: [release-bundles, main, master]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node node_modules/esbuild/install.js
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run verify:build
      - name: Verify standalone distribution packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          pnpm pack
          node scripts/build-npm-entry.mjs --tarball "dsh-boot-studio-$VERSION.tgz" --out npm-entry --repo "$GITHUB_REPOSITORY"
          pnpm --dir npm-entry pack --pack-destination "$GITHUB_WORKSPACE"
          node scripts/verify-package.mjs "dsh-boot-studio-$VERSION.tgz" "dsh-openup-lewis-$VERSION.tgz"
          sha256sum "dsh-boot-studio-$VERSION.tgz" "dsh-openup-lewis-$VERSION.tgz"

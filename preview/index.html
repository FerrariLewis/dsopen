<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>开机动画工作室 · 本地预览</title>
    <style>
      *{box-sizing:border-box}html,body,#root{margin:0;min-height:100%;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}body{background:#0a101a;color:#e5eaf2}button,input,select{font:inherit}button{cursor:pointer}.demo-shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.demo-nav{border-right:1px solid #202b3b;background:#0d1521;padding:30px 18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh}.demo-brand{font-weight:650;letter-spacing:-.5px;font-size:19px;margin:0 10px 30px}.demo-brand span{display:block;color:#7f91ad;font-size:11px;letter-spacing:2px;margin-top:7px}.demo-nav button{border:0;border-radius:10px;color:#a7b6ca;background:transparent;text-align:left;padding:13px}.demo-nav button[aria-current=page]{background:#1b2c44;color:#d9ecff}.demo-nav footer{margin-top:auto;color:#6d809c;font-size:12px;line-height:1.8;padding:10px}.demo-content{padding:28px 38px;min-width:0}.demo-banner{display:flex;justify-content:space-between;gap:20px;align-items:center;color:#7d91ad;font-size:12px;padding-bottom:18px;border-bottom:1px solid #1e2b3f;margin-bottom:26px}.demo-banner strong{color:#6ce2bb;font-weight:500}.demo-chat{max-width:740px;margin:15vh auto;text-align:center}.demo-chat h1{font-weight:500;font-size:35px;letter-spacing:-1px}.demo-chat p{color:#8194af;line-height:1.8}.demo-chat .demo-pill{display:inline-block;border:1px solid #28415d;background:#13243a;padding:10px 16px;border-radius:100px;font-size:12px;color:#add0ed}.demo-chat button{border:0;background:#80d9ff;color:#07121e;padding:13px 22px;border-radius:10px;margin-top:26px}.demo-compose{margin-top:50px;padding:24px;text-align:left;border:1px solid #2b3b50;border-radius:20px;color:#6d819a;background:#101b2b}.demo-compose small{display:block;text-align:right;margin-top:36px}.demo-mobile-brand{display:none}@media(max-width:760px){.demo-shell{display:block}.demo-nav{height:auto;position:static;flex-direction:row;align-items:center;padding:12px;border-right:0;border-bottom:1px solid #202b3b}.demo-brand{font-size:13px;margin:0 auto 0 0}.demo-brand span,.demo-nav footer{display:none}.demo-nav button{padding:10px}.demo-content{padding:18px 14px}.demo-banner{line-height:1.6;align-items:flex-start}.demo-chat{margin:12vh auto}.demo-chat h1{font-size:28px}}
      @media(max-width:760px){.demo-nav{gap:4px}.demo-brand{font-size:12px;min-width:80px}.demo-nav button{padding:10px 8px;font-size:12px;white-space:nowrap}}
    </style>
  </head>
  <body><div id="root"></div><script src="/app.js"></script></body>
</html>
